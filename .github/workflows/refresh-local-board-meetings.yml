name: Refresh Local Board Meetings

on:
  schedule:
    # Daily morning refresh. GitHub cron is UTC, so this is 8:17 AM Pacific
    # during daylight saving time and 7:17 AM during standard time.
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: local-board-meeting-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh calendar and agenda feed
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local-board-meetings.txt

      - name: Run monitor unit tests
        run: python -m unittest tests.test_local_board_meetings

      - name: Refresh meeting data and publish
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          AGENDA_SMTP_HOST: ${{ secrets.AGENDA_SMTP_HOST }}
          AGENDA_SMTP_PORT: ${{ secrets.AGENDA_SMTP_PORT }}
          AGENDA_SMTP_USERNAME: ${{ secrets.AGENDA_SMTP_USERNAME }}
          AGENDA_SMTP_PASSWORD: ${{ secrets.AGENDA_SMTP_PASSWORD }}
          AGENDA_SMTP_FROM: ${{ secrets.AGENDA_SMTP_FROM }}
          AGENDA_NOTIFICATION_TO: apeck@calworkforce.org
          AGENDA_SMTP_USE_SSL: ${{ secrets.AGENDA_SMTP_USE_SSL }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          notification_backup="${RUNNER_TEMP}/agenda_notifications.json"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Push was rejected. Refreshing from origin/${TARGET_BRANCH} and regenerating."
              git fetch origin "${TARGET_BRANCH}"
              git reset --hard "origin/${TARGET_BRANCH}"
              if [ -f "${notification_backup}" ]; then
                cp "${notification_backup}" data/local_board_meetings/agenda_notifications.json
              fi
            fi

            notify_args=()
            if [ -n "${AGENDA_SMTP_HOST}" ] && [ -n "${AGENDA_SMTP_USERNAME}" ] && [ -n "${AGENDA_SMTP_PASSWORD}" ] && [ -n "${AGENDA_SMTP_FROM}" ]; then
              notify_args+=(--notify-agendas)
            else
              echo "Agenda email secrets are not configured; notification delivery is disabled."
            fi

            python -m etl.local_board_meetings.runner --log-level WARNING "${notify_args[@]}"
            cp data/local_board_meetings/public/index.html docs/index.html
            cp data/local_board_meetings/public/calendar.ics docs/calendar.ics

            git add docs/index.html docs/calendar.ics \
              data/local_board_meetings/source_registry.csv \
              data/local_board_meetings/progress_log.md \
              data/local_board_meetings/active_meetings.json \
              data/local_board_meetings/coverage_history.json \
              data/local_board_meetings/coverage_matrix.md \
              data/local_board_meetings/agenda_notifications.json

            if git diff --cached --quiet; then
              echo "No calendar changes to publish."
              exit 0
            fi

            git commit -m "Refresh local board meeting calendar"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi

            cp data/local_board_meetings/agenda_notifications.json "${notification_backup}"
            echo "Push attempt ${attempt} failed."
            sleep $((attempt * 5))
          done

          echo "Failed to publish calendar changes after 3 attempts." >&2
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy calendar to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
